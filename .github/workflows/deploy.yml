name: Multiple Go functions deploy

on:
  push:
    branches:
      - main
    paths:
      - 'main/**'
      - 'users/**'
      - 'register/**'
      - 'orders/**'
      - 'login/**'
  workflow_dispatch:

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      main: ${{ steps.filter.outputs.main }}
      users: ${{ steps.filter.outputs.users }}
      register: ${{ steps.filter.outputs.register }}
      orders: ${{ steps.filter.outputs.orders }}
      login: ${{ steps.filter.outputs.login }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            main: ['main/**']
            users: ['users/**']
            register: ['register/**']
            orders: ['orders/**']
            login: ['login/**']

  deploy-main:
    needs: detect-changes
    if: needs.detect-changes.outputs.main == 'true'
    uses: ./.github/workflows/deploy-go-function.yml
    with:
      name: main
    secrets: inherit

  deploy-users:
    needs: detect-changes
    if: needs.detect-changes.outputs.users == 'true'
    uses: ./.github/workflows/deploy-go-function.yml
    with:
      name: users
    secrets: inherit

  deploy-register:
    needs: detect-changes
    if: needs.detect-changes.outputs.register == 'true'
    uses: ./.github/workflows/deploy-go-function.yml
    with:
      name: register
    secrets: inherit

  deploy-orders:
    needs: detect-changes
    if: needs.detect-changes.outputs.orders == 'true'
    uses: ./.github/workflows/deploy-go-function.yml
    with:
      name: orders
    secrets: inherit

  deploy-login:
    needs: detect-changes
    if: needs.detect-changes.outputs.login == 'true'
    uses: ./.github/workflows/deploy-go-function.yml
    with:
      name: login
    secrets: inherit