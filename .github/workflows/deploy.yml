name: Multiple Go functions deploy

on:
  push:
    branches:
      - main
    paths:
      - 'main/**'
      - 'users/**'
      - 'register/**'
      - 'orders/**'
      - 'login/**'

jobs:

  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      main: ${{ steps.filter.outputs.main }}
      users: ${{ steps.filter.outputs.users }}
      register: ${{ steps.filter.outputs.register }}
      orders: ${{steps.filter.outputs.orders}}
      login: ${{steps.filter.outputs.login}}

    steps:
      - uses: actions/checkout@v3

      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            main:
              - 'main/**'
            users:
              - 'users/**'
            register:
              - 'register/**'
            orders:
              - 'orders/**'
            login:
              - 'login/**'

  deploy-main:
    needs: detect-changes
    if: needs.detect-changes.outputs.main == 'true'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: main

    env:
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_project_number: ${{ secrets.GCP_PROJECT_NUMBER }}
      TF_VAR_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      TF_VAR_region: ${{ secrets.GCP_REGION }}

    steps:
      - uses: actions/checkout@v3

      - name: Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3

      - name: Create Source Zip
        run: |
          cd function
          zip -r ../source.zip .

      - run: terraform init
      - run: terraform plan -input=false
      - run: terraform apply -auto-approve -input=false

  deploy-users:
    needs: detect-changes
    if: needs.detect-changes.outputs.users == 'true'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: users

    env:
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_project_number: ${{ secrets.GCP_PROJECT_NUMBER }}
      TF_VAR_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      TF_VAR_region: ${{ secrets.GCP_REGION }}

    steps:
      - uses: actions/checkout@v3

      - name: Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
      - name: Debug Folder
        run: |
            pwd
            ls -R

      - name: Create Source Zip
        run: |
          cd function
          zip -r ../source.zip .

      - run: terraform init
      - run: terraform plan -input=false
      - run: terraform apply -auto-approve -input=false


  deploy-register:
    needs: detect-changes
    if: needs.detect-changes.outputs.register == 'true'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: register

    env:
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_project_number: ${{ secrets.GCP_PROJECT_NUMBER }}
      TF_VAR_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      TF_VAR_region: ${{ secrets.GCP_REGION }}

    steps:
      - uses: actions/checkout@v3

      - name: Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3

      - name: Create Source Zip
        run: |
          cd function
          zip -r ../source.zip .

      - run: terraform init
      - run: terraform plan -input=false
      - run: terraform apply -auto-approve -input=false

  deploy-orders:
    needs: detect-changes
    if: needs.detect-changes.outputs.orders == 'true'
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    defaults:
      run:
        working-directory: orders

    env:
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_project_number: ${{ secrets.GCP_PROJECT_NUMBER }}
      TF_VAR_service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      TF_VAR_region : ${{ secrets.GCP_REGION }}
      
    steps:
      - uses: actions/checkout@v3

      - name: Authenticate to GCP (OIDC)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{secrets.GCP_PROVIDER}}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
        
      - uses: hashicorp/setup-terraform@v3

      - name: Create Source Zip
        run: |
          cd function
          zip -r ../source.zip .

      - run: terraform init
      - run: terraform plan -input=false
      - run: terraform apply -auto-approve -input=false


  deploy-login:
    needs: detect-changes
    if: needs.detect-changes.outputs.login == 'true'
    uses: ./.github/workflows/deploy-go-function.yml
    with:
      name: login
      tf_vars: >-
        -var="project_id=$PROJECT_ID"
        -var="region=$REGION"
        -var="project_number=$PROJECT_NUMBER"
    secrets:
      PROJECT_ID: ${{ secrets.PROJECT_ID}}
      REGION: ${{ secrets.REGION }}
      PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}